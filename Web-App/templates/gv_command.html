<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCAN GV LDK Command</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="mb-4">BCAN GV LDK Command</h1>
        
        <ul class="nav nav-tabs mb-3" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="config-tab" data-bs-toggle="tab" data-bs-target="#config" type="button" role="tab" aria-controls="config" aria-selected="true">Config</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="control-tab" data-bs-toggle="tab" data-bs-target="#control" type="button" role="tab" aria-controls="control" aria-selected="false">Control</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="system-tab" data-bs-toggle="tab" data-bs-target="#system" type="button" role="tab" aria-controls="system" aria-selected="false">System</button>
            </li>
        </ul>
        
        <div class="tab-content" id="mainTabsContent">
            <!-- Config Tab -->
            <div class="tab-pane fade show active" id="config" role="tabpanel" aria-labelledby="config-tab">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">Gateway Configuration</div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="gateway-ip" class="form-label">Gateway IP</label>
                                    <input type="text" class="form-control" id="gateway-ip" value="{{ gateway_ip }}">
                                </div>
                                <div class="mb-3">
                                    <label for="gateway-port" class="form-label">Gateway Port</label>
                                    <input type="number" class="form-control" id="gateway-port" value="{{ gateway_port }}">
                                </div>
                                <button id="save-gateway-config" class="btn btn-primary">Save Configuration</button>
                            </div>
                        </div>
                        
                        <div class="card mt-3">
                            <div class="card-header">Status</div>
                            <div class="card-body">
                                <p>
                                    <span id="connection-status">
                                        <span class="status-indicator status-disconnected"></span>
                                        Disconnected
                                    </span>
                                </p>
                                <p>Gateway: <span id="gateway-info">-</span></p>
                                <p>Last Authentication: <span id="last-auth-time">-</span></p>
                                <button id="authenticate-btn" class="btn btn-primary btn-sm">Authenticate Now</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">Device Discovery</div>
                            <div class="card-body">
                                <div class="mb-2">
                                    <label>Device Range:</label>
                                    <div class="input-group input-group-sm mb-2">
                                        <span class="input-group-text">From</span>
                                        <input type="number" id="device-range-start" class="form-control" value="1" min="1" max="99">
                                        <span class="input-group-text">To</span>
                                        <input type="number" id="device-range-end" class="form-control" value="12" min="1" max="99">
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" id="discover-basestation" checked>
                                        <label class="form-check-label" for="discover-basestation">Basestation</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" id="discover-camera" checked>
                                        <label class="form-check-label" for="discover-camera">Camera</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="checkbox" id="discover-ocp" checked>
                                        <label class="form-check-label" for="discover-ocp">OCP</label>
                                    </div>
                                    <button id="discover-btn" class="btn btn-primary btn-sm mt-2">Discover Devices</button>
                                </div>
                                <div>
                                    <p>Found Devices: <span id="found-devices-count">0</span></p>
                                    <div id="discovery-status" class="small text-muted"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Control Tab -->
            <div class="tab-pane fade" id="control" role="tabpanel" aria-labelledby="control-tab">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">Command Templates</div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="selected-device" class="form-label">Select Device</label>
                                    <select id="selected-device" class="form-select">
                                        <option value="">-- Select a device --</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label for="function-select" class="form-label">Select Function</label>
                                    <select id="function-select" class="form-select">
                                        <option value="">-- Select a function --</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label d-block">Command Type</label>
                                    <div class="btn-group" role="group">
                                        <input type="radio" class="btn-check" name="command-type" id="command-type-change" value="change" checked>
                                        <label class="btn btn-outline-primary" for="command-type-change">Change Value</label>
                                        <input type="radio" class="btn-check" name="command-type" id="command-type-request" value="request">
                                        <label class="btn btn-outline-primary" for="command-type-request">Request Value</label>
                                    </div>
                                </div>
                                <div class="mb-3" id="function-value-container">
                                    <label for="function-value" class="form-label">Function Value</label>
                                    <input type="text" class="form-control" id="function-value">
                                </div>
                                <button id="apply-template" class="btn btn-primary">Apply Template</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">Discovered Devices</div>
                            <div class="card-body">
                                <div class="mb-2">
                                    <select id="device-type-filter" class="form-select form-select-sm d-inline-block w-auto me-2">
                                        <option value="all">All Types</option>
                                        <option value="Basestation">Basestation</option>
                                        <option value="Camera">Camera</option>
                                        <option value="OCP">OCP</option>
                                    </select>
                                    <button id="refresh-devices-btn" class="btn btn-outline-secondary btn-sm">Refresh</button>
                                </div>
                                <div id="discovered-devices-list" class="list-group" style="max-height: 200px; overflow-y: auto;">
                                    <div class="list-group-item text-muted">No devices discovered yet</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header">XML Command</div>
                            <div class="card-body d-flex flex-column">
                                <div class="flex-grow-1 d-flex flex-column">
                                    <textarea id="command-area" class="form-control command-area flex-grow-1" placeholder="Enter XML command here..."></textarea>
                                </div>
                                <div class="mt-2 d-flex justify-content-between">
                                    <div>
                                        <button id="send-btn" class="btn btn-primary me-2">Send Command</button>
                                        <button id="clear-command-btn" class="btn btn-secondary">Clear</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header">Response</div>
                            <div class="card-body d-flex flex-column">
                                <div id="response-area" class="response-area p-3 flex-grow-1">
                                    <div class="loading">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    </div>
                                    <div class="response-content"></div>
                                </div>
                                <div class="mt-2 d-flex justify-content-between">
                                    <div>
                                        <button id="clear-response-btn" class="btn btn-secondary">Clear</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- System Tab -->
            <div class="tab-pane fade" id="system" role="tabpanel" aria-labelledby="system-tab">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header">XML Command</div>
                            <div class="card-body d-flex flex-column">
                                <div class="flex-grow-1 d-flex flex-column">
                                    <textarea id="system-command-area" class="form-control command-area flex-grow-1" placeholder="Enter XML command here..."></textarea>
                                </div>
                                <div class="mt-2 d-flex justify-content-between">
                                    <div>
                                        <button id="system-send-btn" class="btn btn-primary me-2">Send Command</button>
                                        <button id="system-clear-command-btn" class="btn btn-secondary">Clear</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header">XML Response</div>
                            <div class="card-body d-flex flex-column">
                                <div id="system-response-area" class="response-area p-3 flex-grow-1">
                                    <div class="loading">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    </div>
                                    <div class="response-content"></div>
                                </div>
                                <div class="mt-2 d-flex justify-content-between">
                                    <div>
                                        <button id="system-clear-response-btn" class="btn btn-secondary">Clear</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="card-header">Command History</div>
                            <div class="card-body">
                                <div id="history-panel" class="history-panel">
                                    <!-- Command history goes here-->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
